#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cloud"
name = "Cloud"
description.en = "Personal file storage with a web interface and a native iOS client — upload, browse, preview and share your files. Sign in with the YunoHost portal or with a passkey."
description.fr = "Stockage de fichiers personnel avec interface web et client iOS natif. Connexion par le portail YunoHost ou par clé d\'accès."
version = "1.1.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
code = "https://github.com/notarisj/cloud_ynh"

[integration]
yunohost   = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = true
sso = true
disk = "700M"
# The web build (Vite + tsc) and sharp's install are the peak; 768M has been
# seen to fail on a small VPS that is also running its usual services.
ram.build = "1G"
ram.runtime = "256M"

[install]

  [install.domain]
  type = "domain"

  [install.path]
  type = "path"
  default = "/cloud"

  [install.init_main_permission]
  type = "group"
  default = "all_users"

  [install.user_quota]
  ask.en = "Per-user storage quota in GB (0 = unlimited)"
  type = "number"
  default = 0
  min = 0
  max = 100000

  [install.max_upload]
  ask.en = "Maximum size of a single uploaded file, in GB"
  type = "number"
  default = 20
  min = 1
  max = 1000

  [install.enable_shared]
  ask.en = "Allow users to share items with everyone who has access to this app?"
  ask.fr = "Permettre aux utilisateurs de partager des éléments avec toutes les personnes ayant accès à cette application ?"
  help.en = "Shared items stay in their owner's own files and still count against that person's quota. Sharing only makes them readable by others, and can be undone at any time."
  type = "boolean"
  default = true

  [install.enable_passkeys]
  ask.en = "Allow signing in with a passkey?"
  ask.fr = "Autoriser la connexion par clé d\'accès ?"
  help.en = "A passkey signs a user in with the fingerprint, face or PIN on their own device, without a password. The YunoHost portal keeps working either way."
  type = "boolean"
  default = true

  [install.enable_thumbnails]
  ask.en = "Generate thumbnails and previews for images, videos and PDFs?"
  type = "boolean"
  default = true

[resources]

  # System user the API runs as. It owns install_dir and data_dir; no root needed.
  [resources.system_user]

  [resources.install_dir]
  dir = "/var/www/__APP__"

  # User files live here. Kept outside install_dir so upgrades never touch them.
  [resources.data_dir]
  dir = "/home/yunohost.app/__APP__"

  [resources.ports]
  main.default = 3010

  [resources.apt]
  packages = ["poppler-utils", "ffmpeg"]

  [resources.permissions]

    # The SPA and the SSO bridge endpoint — protected by SSOwat.
    [resources.permissions.main]
    url = "/"

    # The versioned REST API used by native clients (iOS) and, after the SSO
    # handshake, by the SPA itself. SSOwat must NOT gate this: native apps have
    # no portal cookie. Authentication is enforced in-process by the JWT
    # middleware, so "visitors" here means "reachable", not "public".
    [resources.permissions.api]
    url = "/api/v1"
    allowed = "visitors"
    auth_header = false
    show_tile = false
    protected = true
