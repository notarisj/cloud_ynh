#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# Uploads are streamed straight through to the API, which enforces the real
# size limit (MAX_UPLOAD_BYTES) and writes to disk chunk by chunk. Letting
# nginx buffer multi-gigabyte bodies to /var/lib/nginx would be pointless and
# would fill the system disk instead of the data volume.
client_max_body_size 0;

#=================================================
# REST API — reachable without an SSOwat session
#=================================================
# Native clients (the iOS app) authenticate with a Bearer token, not with a
# portal cookie, so this location is registered as a "visitors" permission and
# SSOwat lets it through untouched. Authorisation happens in the API process:
# every route below /api/v1 except /api/v1/auth/login and /api/v1/auth/refresh
# requires a valid JWT. The shared proxy secret is still forwarded so the API
# can reject anything that reached port __PORT__ without going through nginx.
location __PATH__/api/v1/ {
    proxy_pass http://127.0.0.1:__PORT__/api/v1/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Cloud-Secret    __PROXY_SECRET__;

    # Stream request and response bodies — required for large up/downloads.
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_max_temp_file_size 0;

    proxy_read_timeout    3600;
    proxy_send_timeout    3600;
    proxy_connect_timeout 10;

    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
}

#=================================================
# SSO BRIDGE — protected by SSOwat
#=================================================
# The SPA calls __PATH__/api/sso/session once at boot. SSOwat has already
# authenticated the browser at this point and injects the user's identity,
# which the API exchanges for the same JWT pair the iOS app receives. From
# then on the SPA talks to /api/v1 like any other client.
location __PATH__/api/sso/ {
    # SSOwat may publish the user either as an nginx variable (ngx.var.ynh_user)
    # or as a request header (ngx.req.set_header). Initialise the variables so
    # nginx does not error on an undefined name, and forward both forms.
    set $ynh_user     "";
    set $ynh_email    "";
    set $ynh_fullname "";

    proxy_pass http://127.0.0.1:__PORT__/api/sso/;
    proxy_http_version 1.1;

    proxy_set_header YNH_USER       $ynh_user;
    proxy_set_header X-Ynh-User     $http_ynh_user;
    proxy_set_header YNH_EMAIL      $ynh_email;
    proxy_set_header X-Ynh-Email    $http_ynh_email;
    proxy_set_header YNH_FULLNAME   $ynh_fullname;
    proxy_set_header X-Cloud-Secret __PROXY_SECRET__;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
}

#=================================================
# SINGLE PAGE APP
#=================================================
location __PATH__/ {
    set $ynh_user     "";
    set $ynh_email    "";
    set $ynh_fullname "";

    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade        $http_upgrade;
    proxy_set_header Connection     "upgrade";

    proxy_set_header YNH_USER       $ynh_user;
    proxy_set_header X-Ynh-User     $http_ynh_user;
    proxy_set_header X-Cloud-Secret __PROXY_SECRET__;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout    3600;
    proxy_send_timeout    3600;
    proxy_connect_timeout 10;

    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
}
